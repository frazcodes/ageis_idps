[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aegis-shared"
version = "0.1.0"
description = "Aegis IDPS shared contracts: event schema, enums, configuration and logging."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["aegis_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
